        <h1>Ayurhitam Receipt Generator</h1>

        <h3>Customer Info</h3>
        <input id="firstName" placeholder="First Name" />
        <input id="lastName" placeholder="Last Name" />
        <input id="phone" placeholder="Phone Number" />
        <input id="date" type="date" />

        <h3>Services</h3>
        <div id="services"></div>
        <button onclick="addService()" class="button">Add Service</button>
        <br />
        <button onclick="generatePDF()" class="button">Generate Receipt PDF</button>

        <script>
            const { jsPDF } = window.jspdf;

            function addService() {
                const div = document.createElement('div');
                div.className = 'service';
                div.innerHTML = `
            <input placeholder="Service Name" class="serviceName" />
            <input placeholder="Cost" type="number" class="serviceCost" />
        `;
                document.getElementById('services').appendChild(div);
            }

            function receiptNumber(first, last, dateStr) {
                const date = new Date(dateStr);
                const months = ['JA', 'FE', 'MR', 'AP', 'MY', 'JN', 'JL', 'AU', 'SE', 'OC', 'NO', 'DE'];
                return (
                    (first[0] || 'X').toUpperCase() +
                    (last[0] || 'X').toUpperCase() +
                    months[date.getMonth()] +
                    date.getDate() +
                    String(date.getFullYear()).slice(-2)
                );
            }

            // New helper to grab the image already loaded in the browser
            function getBase64Image(imgElement) {
                const canvas = document.createElement("canvas");
                canvas.width = imgElement.naturalWidth;
                canvas.height = imgElement.naturalHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(imgElement, 0, 0);
                return canvas.toDataURL("image/png");
            }

            function buildPDF(doc, first, last, phone, date, receiptNo) {
                // Grab the logo from the DOM
                const logoImg = document.getElementById('logoImage');

                try {
                    const logoData = getBase64Image(logoImg);
                    // Parameters: data, format, x, y, width, height
                    doc.addImage(logoData, 'PNG', 80, 5, 50, 50);
                } catch (e) {
                    console.warn('Logo could not be added to PDF. Ensure you are viewing this through a local server or the image is fully loaded.', e);
                }

                doc.setFontSize(12);
                let y = 30;
                doc.text('Ayurhitam LLC', 20, 40 + y);
                doc.text('43255 Mission Blvd, #100', 20, 46 + y);
                doc.text('Fremont, CA 94539', 20, 52 + y);
                doc.text('Phone: 510-556-3738', 20, 58 + y);

                doc.text(`Receipt #: ${receiptNo}`, 20, 70 + y);
                doc.text(`Name: ${first} ${last}`, 20, 78 + y);
                doc.text(`Phone: ${phone}`, 20, 84 + y);
                doc.text(`Date: ${date}`, 20, 90 + y);

                let z = 105;
                doc.text('Services:', 20, z + y);
                z += 8;

                let total = 0;
                document.querySelectorAll('.service').forEach(s => {
                    const name = s.querySelector('.serviceName').value || "Service";
                    const cost = parseFloat(s.querySelector('.serviceCost').value || 0);
                    total += cost;
                    doc.text(`${name} - $${cost.toFixed(2)}`, 20, z + y);
                    z += 8;
                });

                doc.setFontSize(14);
                doc.text(`Total: $${total.toFixed(2)}`, 20, z + 10 + y);

                doc.setFontSize(10);
                doc.text('Thank you for choosing Ayurhitam!', 20, z + 20 + y + 60);
            }

            async function generatePDF() {
                const first = document.getElementById('firstName').value;
                const last = document.getElementById('lastName').value;
                const phone = document.getElementById('phone').value;
                const date = document.getElementById('date').value;

                if (!first || !last || !date) {
                    alert('Fill required fields (First Name, Last Name, and Date)');
                    return;
                }

                const receiptNo = receiptNumber(first, last, date);
                const doc = new jsPDF();

                buildPDF(doc, first, last, phone, date, receiptNo);

                doc.save(`receipt_${receiptNo}.pdf`);
            }

            // Initialize with one service row
            addService();
        </script>
